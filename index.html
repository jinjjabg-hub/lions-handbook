.btn-gold{background:var(--gold);color:var(--navy-d)}

.badge-exec{background:rgba(240,192,64,.18);color:var(--gold-d)}

const ADMIN_BIRTHS = ['19620304', '19730805', '19840226'];

function checkSession() {
  const saved = sessionStorage.getItem('lions_user');
  if (saved) {
    currentUser = JSON.parse(saved);
    isAdmin = ADMIN_BIRTHS.includes(currentUser.birth);
    return true;
  }
  return false;
}

function parseBirth(bStr) {
  // "1962.3.4" → "19620304"
  if (!bStr) return '';
  const parts = bStr.replace(/[^0-9.]/g,'').split('.');
  if (parts.length === 3) {
    const y = parts[0];
    const m = parts[1].padStart(2,'0');
    const d = parts[2].padStart(2,'0');
    return y + m + d;
  }
  return bStr.replace(/\D/g,'').substring(0,8);
}

function doLogin(birth, phone4) {
  const member = MEMBERS_CLEAN.find(m => {
    const b = parseBirth(m.b);
    const p = (m.f||'').replace(/\D/g,'').slice(-4);
    return b === birth && p === phone4;
  });
  if (member) {
    currentUser = {birth, name: member.name, id: member.id};
    isAdmin = ADMIN_BIRTHS.includes(birth);
    sessionStorage.setItem('lions_user', JSON.stringify(currentUser));
    return member;
  }
  return null;
}

function doLogout() {
  currentUser = null; isAdmin = false;
  sessionStorage.removeItem('lions_user');

}

async function initFirestore() {
  try {
    const snap = await db.collection('members').limit(1).get();
    if (!snap.empty) return;

    const apiKey = firebaseConfig.apiKey;
    const batch = db.batch();

    for (const m of MEMBERS_CLEAN) {
      const birth = parseBirth(m.b);
      if (!birth) continue;
      const phone4 = (m.f || '').replace(/\D/g, '').slice(-4);

      batch.set(db.collection('members').doc(birth), {
        id: m.id, name: m.name, rom: m.rom || '', role: m.role || '',
        birth, joined: m.j || '', company: m.co || '', phone: m.f || '',
        status: m.status || '회원', spouse: m.spouse || '',
        dica: !!m.dica, coAddr: m.coAddr || ''
      });

      if (phone4.length === 4) {
        try {
          const res = await fetch(
            'https://identitytoolkit.googleapis.com/v1/accounts:signUp?key=' + apiKey,
            {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ email: birth + '@lions.kr', password: phone4, returnSecureToken: false })
            }
          );
          const data = await res.json();
          if (data.error && data.error.message !== 'EMAIL_EXISTS') {
            console.warn('Auth create:', birth, data.error.message);
          }
        } catch (e) { console.warn('Auth error:', birth, e); }
      }
    }

    await batch.commit();
    showToast('회원 데이터 등록 완료');
  } catch (e) {
    console.error('initFirestore error:', e);
  }
}

async function tryLogin() {
  const birth = document.getElementById('login-id').value.trim();
  const pw = document.getElementById('login-pw').value.trim();
  const err = document.getElementById('login-err');
  const btn = document.getElementById('login-submit-btn');

  if (birth.length !== 8 || pw.length !== 4) {
    err.style.display = 'block';
    err.textContent = '생년월일 8자리와 전화번호 끝 4자리를 입력해주세요';
    return;
  }
  err.style.display = 'none';
  if (btn) { btn.disabled = true; btn.textContent = '확인 중...'; }

  const email = birth + '@lions.kr';

  async function onLoginSuccess(cred) {
    let memberStatus = null;
    try {
      const memberDoc = await db.collection('members').doc(birth).get();
      if (memberDoc.exists) memberStatus = memberDoc.data().status;
    } catch (e) { /* Firestore 미설정 시 무시 */ }

    if (memberStatus === '탈퇴') {
      await auth.signOut();
      err.style.display = 'block';
      err.textContent = '탈퇴한 회원입니다. 사무장에게 문의하세요.';
      if (btn) { btn.disabled = false; btn.textContent = '회원수첩 열기'; }
      return;
    }

    const localMember = MEMBERS_CLEAN.find(m => parseBirth(m.b) === birth);
    currentUser = {
      birth,
      name: localMember ? localMember.name : '회원',
      id: localMember ? localMember.id : 0,
      uid: cred.user.uid
    };
    isAdmin = ADMIN_BIRTHS.includes(birth);
    sessionStorage.setItem('lions_user', JSON.stringify(currentUser));

    const ls = document.getElementById('login-screen');
    ls.style.display = 'none';
    ls.innerHTML = '';
    document.getElementById('cover').style.display = 'none';
    document.getElementById('main').style.display = 'flex';
    showTab('home');

    if (isAdmin) initFirestore();
  }

  // 1단계: Firebase Auth 로그인 시도
  try {
    const cred = await auth.signInWithEmailAndPassword(email, pw);
    await onLoginSuccess(cred);
    return;
  } catch (e) {
    const c = e.code || '';
    if (c === 'auth/too-many-requests') {
      err.style.display = 'block';
      err.textContent = '잠시 후 다시 시도해주세요';
      if (btn) { btn.disabled = false; btn.textContent = '회원수첩 열기'; }
      return;
    }
    // 계정 없음/비밀번호 오류 → 로컬 검증으로 진행
    if (c !== 'auth/user-not-found' && c !== 'auth/wrong-password' && c !== 'auth/invalid-credential') {
      err.style.display = 'block';
      err.textContent = '로그인 오류가 발생했습니다. 다시 시도해주세요.';
      if (btn) { btn.disabled = false; btn.textContent = '회원수첩 열기'; }
      return;
    }
  }

  // 2단계: 로컬 MEMBERS_CLEAN 검증
  const localMember = MEMBERS_CLEAN.find(m => {
    const b = parseBirth(m.b);
    const p = (m.f || '').replace(/\D/g, '').slice(-4);
    return b === birth && p === pw;
  });

  if (!localMember) {
    err.style.display = 'block';
    err.textContent = '생년월일 또는 전화번호가 맞지 않습니다';
    if (btn) { btn.disabled = false; btn.textContent = '회원수첩 열기'; }
    return;
  }

  // 3단계: 로컬 검증 성공 → Firebase Auth 계정 자동 생성 후 로그인
  try {
    const cred = await auth.createUserWithEmailAndPassword(email, pw);
    await onLoginSuccess(cred);
  } catch (e) {
    // 계정 생성 실패해도 로컬 세션으로 진입
    console.warn('Auth createUser failed:', e.code);
    currentUser = { birth, name: localMember.name, id: localMember.id, uid: '' };
    isAdmin = ADMIN_BIRTHS.includes(birth);
    sessionStorage.setItem('lions_user', JSON.stringify(currentUser));
    const ls = document.getElementById('login-screen');
    ls.style.display = 'none';
    ls.innerHTML = '';
    document.getElementById('cover').style.display = 'none';
    document.getElementById('main').style.display = 'flex';
    showTab('home');
    if (isAdmin) initFirestore();
  }
}


const MEMBERS_CLEAN = MEMBERS.filter((m,i,a) => m.name && m.f && a.findIndex(x=>x.name===m.name)===i);

const KA = ['가','나','다','라','마','바','사','아','자','차','카','타','파','하'];

function getInitial(name) {
  if (!name) return '?';
  const c = name.charCodeAt(0);
  if (c < 0xAC00 || c > 0xD7A3) return name[0];
  const idx = Math.floor((c - 0xAC00) / 588);
  return KA[['ㄱ','ㄴ','ㄷ','ㄹ','ㅁ','ㅂ','ㅅ','ㅇ','ㅈ','ㅊ','ㅋ','ㅌ','ㅍ','ㅎ'].indexOf(
    ['ㄱ','ㄲ','ㄴ','ㄷ','ㄸ','ㄹ','ㅁ','ㅂ','ㅃ','ㅅ','ㅆ','ㅇ','ㅈ','ㅉ','ㅊ','ㅋ','ㅌ','ㅍ','ㅎ'][idx]
  )] || name[0];
}

function renderMembers(el) {
  const sorted = [...MEMBERS_CLEAN].sort((a,b) => {
    const ia = KA.indexOf(getInitial(a.name));
    const ib = KA.indexOf(getInitial(b.name));
    if (ia !== ib) return (ia<0?99:ia)-(ib<0?99:ib);
    return a.name.localeCompare(b.name,'ko');
  });

  el.innerHTML = `
  <div class="appbar">
    <div>
      <div class="appbar-title">회원 명부</div>
      <div class="appbar-sub">정회원 ${MEMBERS_CLEAN.length}명</div>
    </div>
  </div>
  <div style="padding:12px 16px 8px;background:var(--paper);flex-shrink:0">
    <input id="member-search" class="search-box" placeholder="이름 · 직책 · 회사 검색" oninput="filterMembers(this.value)" autocomplete="off"/>
  </div>
  <div style="flex:1;display:flex;min-height:0;position:relative">
    <div id="member-list" class="scroll" style="flex:1;padding-bottom:20px;padding-right:28px"></div>
    <div id="index-rail" style="position:absolute;right:0;top:0;bottom:0;width:28px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px"></div>
  </div>`;

  window._membersSorted = sorted;
  renderMemberList(sorted);
  buildIndexRail(sorted);
}

function renderMemberList(list) {
  const container = document.getElementById('member-list');
  if (!container) return;

  // 그룹핑
  const groups = {};
  list.forEach(m => {
    const k = getInitial(m.name);
    (groups[k] = groups[k]||[]).push(m);
  });

  let html = '';
  KA.forEach(k => {
    if (!groups[k]) return;
    html += `<div id="group-${k}" style="scroll-margin-top:8px">
      <div style="position:sticky;top:0;z-index:1;background:var(--paper-d);padding:5px 16px;display:flex;align-items:center;gap:8px;border-bottom:1px solid var(--line)">
        <span style="font-size:15px;font-weight:800;color:var(--navy)">${k}</span>
        <span style="font-size:12px;color:var(--muted)">${groups[k].length}</span>
      </div>`;
    groups[k].forEach(m => {
      html += `<button onclick="showMember(${m.id})" style="width:100%;display:flex;align-items:center;padding:11px 14px;gap:12px;text-align:left;border:none;border-bottom:1px solid var(--line);background:none;cursor:pointer">
        ${avatar(m.name, m.id===1, 46, m.id)}
        <div style="flex:1;min-width:0">
          <div style="display:flex;align-items:center;gap:7px">
            <span style="font-size:17px;font-weight:700;color:var(--ink)">${m.name}</span>
            ${m.group==='집행부'?`<span class="badge badge-exec">${m.role}</span>`:''}
          </div>
          <div style="font-size:13px;color:var(--muted);margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${m.status||'회원'}${m.co?' · '+m.co.split(' · ')[0]:''}</div>
        </div>
        <div style="flex-shrink:0;text-align:right">
          <div style="font-size:11px;color:var(--muted)">${m.j} 입회</div>
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" style="margin-top:3px"><path d="M9 5l7 7-7 7" stroke="#bbb" stroke-width="2.2" stroke-linecap="round"/></svg>
        </div>
      </button>`;
    });
    html += `</div>`;
  });

  if (!html) html = `<div style="text-align:center;color:var(--muted);margin-top:60px;font-size:16px">검색 결과가 없습니다</div>`;
  container.innerHTML = html;
}

function buildIndexRail(list) {
  const rail = document.getElementById('index-rail');
  if (!rail) return;
  const present = new Set(list.map(m => getInitial(m.name)));
  rail.innerHTML = KA.map(k => `
    <button class="idx-btn${!present.has(k)?' disabled':''}" onclick="${present.has(k)?`jumpToGroup('${k}')`:'void 0'}">${k}</button>
  `).join('');
}

function jumpToGroup(k) {
  const el = document.getElementById('group-'+k);
  const list = document.getElementById('member-list');
  if (el && list) list.scrollTo({top: el.offsetTop - 8, behavior:'smooth'});
}

function filterMembers(q) {
  const kw = q.trim().toLowerCase();
  const filtered = kw
    ? window._membersSorted.filter(m => (m.name+m.role+m.co+m.status+(m.rom||'')).toLowerCase().includes(kw))
    : window._membersSorted;
  renderMemberList(filtered);
  if (!kw) buildIndexRail(filtered);
  else document.getElementById('index-rail').innerHTML = '';
}

    <p style="margin-top:10px"><b>제10조(결석보완)</b> 정기회합 전후 1주일 내 클럽·지구 사무실 방문, 타 클럽 집회 참석, 이사회 옵저버 참석, 협회 인정 라이온스 집회 참석 등으로 결석 보완 가능.</p>
    <div class="reg-h2" style="margin-top:18px">제3장 임원</div>
    <p><b>제13조(임원의 구성)</b> 회장, 직전회장, 제1·2·3부회장, 총무, 재무, L.T, T.T, 이사, 감사, 분과위원장, 장학위원장을 포함하며 필요시 부총무·부재무를 둔다.</p>
    <p style="margin-top:10px"><b>제15조(임원의 임무)</b><br>
    — 회장: 클럽 대표 및 최고 집행자. 이사회·월례회·임시회의 소집 및 주재. 위원 임명 및 임원 협조.<br>
    — 총무: 회장·이사회 감독 하에 클럽·지구·협회간 연락임원. 정기보고, 회의록·회원명부 등 문서관리.<br>

    — L.T(라이온테마): 클럽기·배너·종 등 클럽 비품 관리. 집회시 좌석배치.<br>
    — T.T(테일튀스터): 여흥·게임으로 집회 활성화. 명분있는 벌금 부과 후 재무에 인계.<br>
    — 감사: 2명. 회기초 이사회에서 선출. 회계·회무 감사 후 예결산 보고.<br>
    — 이사: 당해연도 회장이 선출하고 이사회 인준.</p>
    <p style="margin-top:10px"><b>분과위원장 직무:</b><br>

    ③ 사업봉사 — 봉사사업 대안제시<br>
    ④ 회원확장 — 우수 회원확장 및 출석점검<br>
    ⑤ 회무재정 — 회비 미납 방지·탈회 최소화<br>
    ⑥ 의전교육 — 신입회원 오리엔테이션·라이오니즘 교육<br>
    ⑦ 체육레저 — 골프·등산·낚시 등 친선도모<br>
    ⑧ 문화홍보 — 라이온스 활동 정보·문화 개발 및 홍보</p>

    <p><b>제18조(월례회)</b> 정기 월례회는 매월 18일 이사회가 정한 장소에서 개최하되 공휴일인 경우 익일로 한다.</p>
    <p style="margin-top:10px"><b>제19조(임시회의)</b> 회장이 필요하다고 인정되거나 이사회 결의가 있을 시 소집. 목적·시기·장소를 명시한 통지서를 7일전 발송.</p>
    <p style="margin-top:10px"><b>제20조(이사회)</b> 매월 3일(공휴일이면 익일)에 개최. 클럽 승인 시책 집행 책임, 신규사업 입안·심의, 지출 승인, 예금 은행 지정 등 클럽 전반 운영 결정.</p>
    <p style="margin-top:10px"><b>제24조(의결)</b> 재적인원 과반수 참석에 참석인원 과반수 동의로 의결한다.</p>
    <p style="margin-top:10px"><b>제26조(헌장개정)</b> 이사회 구성원 과반수 참석과 2/3 이상 찬성, 클럽 정기 혹은 임시회의에서 출석회원 2/3 이상 찬성투표로 개정할 수 있다. 개정안 2주전 공고 의무.</p>

    <p style="margin-top:10px"><b>제29조(재정)</b> 입회비, 월회비, 봉사금, 특별협찬금, 기타 수입금으로 구성.</p>
    <p style="margin-top:10px"><b>제30조(회비)</b> 입회비·월례회비·이사회비·의무봉사금은 당해연도 이사회 결의에 따른다. 모든 회비 및 의무봉사금은 매년 10월말 이전까지 납부. 미납시 굿스탠딩 자격 상실.</p>
    <div class="reg-h2" style="margin-top:18px">제6장 각막기증봉사사업</div>
    <p><b>제31조~34조</b> 부산라이온스클럽의 각막기증봉사사업. 미국LA코리아타운라이온스클럽과의 협력으로 시력보존을 위한 각막기증사업 운영. 60주년 행사 출연금 일천만원을 기본기금으로 하며 매년 기본기금 충당 후 잉여금을 사업기금으로 활용.</p>
    <div class="reg-h2" style="margin-top:18px">부칙</div>

    <p style="margin-top:10px"><b>제2조</b> 임원과 회원은 라이오니즘 성장 외에 개인적·정치적 야심을 달성하는 수단으로 회원을 이용하지 못한다.</p>
    <p style="margin-top:10px"><b>제3조</b> 회합 중 비회원 단체·개인에게 기부금 모금 불가. 정규 의무금 이외 수입·지출이 필요한 발의는 이사회에 회부.</p>
    <p style="margin-top:10px"><b>제5조(휘장, 뺏지)</b> 협회와 동일한 색상 사용. 공식행사시 전 회원 필히 뺏지 부착.</p>
    <p style="margin-top:10px"><b>제8조(이사회 구성)</b> 직전회장, 제1·2·3부회장, 총무, 재무, L.T, T.T는 당연직 이사. 당해연도 회장 추천으로 1·2년직 이사를 이사회에서 선출. 5월 결정, 6월 취임, 7월 1일 회장단과 업무 개시.</p>

let currentRegTab = '윤리강령';

function renderRules(el) {
  const tabs = ['윤리강령','L.I.O.N.S','라이온스 찬가','클럽 노래','헌장·부칙','문서규정','경조규정','장학규정','지도자수칙','공적심사'];
  el.innerHTML = `
  <div class="appbar">
    <div>
      <div class="appbar-title">헌장 · 규정</div>
      <div class="appbar-sub">부산라이온스클럽</div>
    </div>
  </div>
  <input id="reg-search" class="search-box" placeholder="규정 내 검색..." oninput="searchReg(this.value)" autocomplete="off" style="margin-top:10px"/>
  <div class="tab-row" id="reg-tabrow">
    ${tabs.map(t=>`<button class="reg-tab${t===currentRegTab?' active':''}" onclick="switchRegTab('${t}')" id="rtab-${t.replace(/[^a-zA-Z가-힣]/g,'_')}">${t}</button>`).join('')}
  </div>
  <div id="reg-body" class="scroll">${REGS[currentRegTab]}</div>`;
}

function switchRegTab(t) {
  currentRegTab = t;
  document.querySelectorAll('.reg-tab').forEach(b => b.classList.remove('active'));
  const safe = t.replace(/[^a-zA-Z가-힣]/g,'_');
  const btn = document.getElementById('rtab-'+safe);
  if (btn) btn.classList.add('active');
  document.getElementById('reg-body').innerHTML = REGS[t];
  document.getElementById('reg-search').value = '';
}

function searchReg(q) {
  const kw = q.trim();
  const body = document.getElementById('reg-body');
  if (!kw) { body.innerHTML = REGS[currentRegTab]; return; }
  let html = REGS[currentRegTab];
  const re = new RegExp(kw.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'),'gi');
  body.innerHTML = html.replace(re, m => `<mark class="highlight">${m}</mark>`);
}

function uploadMemberPhoto(id, input) {
  const file = input.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = (e) => {
    // 로컬 미리보기 (Firebase 연동 전)
    const imgs = document.querySelectorAll('[data-member-id="' + id + '"] img');
    showToast(file.name + ' 선택됨 (Firebase 연동 후 저장)');
  };
  reader.readAsDataURL(file);
}

// ===== 카카오톡 감지 =====
(function() {
  const ua = navigator.userAgent;
  if (/KAKAOTALK/i.test(ua)) {
    const href = location.href;
    if (/Android/i.test(ua)) {
      location.href = 'intent://' + href.replace(/https?:\/\//, '') +
        '#Intent;scheme=https;package=com.android.chrome;end';
    } else if (/iPhone|iPad|iPod/i.test(ua)) {
      location.href = 'googlechrome://' + href.replace(/https?:\/\//, '');
      setTimeout(function() { location.replace(href); }, 600);
    }
  }
})();

// ===== Android 뒤로가기 처리 =====
history.pushState(null, '', location.href);
window.addEventListener('popstate', function() {
  history.pushState(null, '', location.href);

  var overlays = screens.querySelectorAll('.screen');

    overlays[overlays.length - 1].remove();
