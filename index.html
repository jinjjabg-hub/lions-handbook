<style>
:root{
  --navy:#1a3a6b;--navy-d:#142d52;--gold:#f0c040;--gold-l:#f7e6ad;--gold-d:#b88a1e;

}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Pretendard','Noto Sans KR',sans-serif;background:#1a1e25;display:flex;justify-content:center;align-items:center;min-height:100vh;overflow:hidden}
#app{width:min(412px,100vw);height:min(892px,100vh);background:var(--paper);border-radius:min(46px,0px);overflow:hidden;position:relative;display:flex;flex-direction:column;box-shadow:0 30px 80px rgba(0,0,0,.5),0 0 0 11px #0c0f14}
.screen{position:absolute;inset:0;display:flex;flex-direction:column;background:var(--paper);animation:fadeUp .25s ease both}
@keyframes fadeUp{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.scroll{flex:1;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch}
.scroll::-webkit-scrollbar{display:none}

/* 공통 */
.appbar{background:var(--navy);padding:14px 16px;flex-shrink:0;display:flex;align-items:center;gap:10px}
.appbar-back{width:36px;height:36px;border-radius:10px;background:rgba(255,255,255,.12);color:#fff;border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.appbar-title{color:#fff;font-size:17px;font-weight:700;flex:1}
.appbar-sub{color:rgba(255,255,255,.65);font-size:12px;margin-top:1px}
.section-label{padding:14px 20px 6px;font-size:12px;font-weight:700;color:var(--muted);letter-spacing:.06em;text-transform:uppercase}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;margin:0 16px 14px;overflow:hidden}
.row{display:flex;align-items:center;padding:13px 16px;border-bottom:1px solid var(--line);gap:12px}
.row:last-child{border-bottom:none}
.row-label{font-size:12px;color:var(--muted);margin-bottom:2px}
.row-val{font-size:14px;color:var(--ink);font-weight:500;word-break:keep-all;line-height:1.4}
.btn-primary{width:100%;min-height:56px;border-radius:14px;background:var(--navy);color:#fff;font-size:16px;font-weight:700;border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px}
.btn-gold{background:var(--gold);color:var(--navy-d)}
.badge{display:inline-block;padding:3px 9px;border-radius:20px;font-size:11px;font-weight:700}
.badge-exec{background:rgba(240,192,64,.18);color:var(--gold-d)}
.badge-status{background:rgba(26,58,107,.1);color:var(--navy)}

/* 탭바 */
#tabbar{background:#fff;border-top:1px solid var(--line);display:flex;flex-shrink:0;padding-bottom:env(safe-area-inset-bottom,0px);overflow:hidden}
.tab-btn{flex:1;padding:6px 2px 4px;border:none;background:none;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:1px;font-size:9px;font-weight:600;color:var(--muted);transition:color .15s;min-width:0;overflow:hidden;white-space:nowrap}
.tab-btn.active{color:var(--navy)}
.tab-btn svg{transition:transform .15s}
.tab-btn.active svg{transform:scale(1.12)}

/* 표지 */
#cover{background:radial-gradient(130% 90% at 50% 8%,#21477f,#0d1f3d);color:#fff;align-items:center;justify-content:space-between;padding:0;text-align:center;position:absolute;inset:0;display:flex;flex-direction:column;z-index:10}
.cover-frame{position:absolute;inset:16px;border:1.5px solid rgba(240,192,64,.5);border-radius:22px;pointer-events:none}
.cover-frame2{position:absolute;inset:22px;border:1px solid rgba(240,192,64,.22);border-radius:17px;pointer-events:none}
.crest{width:120px;height:120px;border-radius:50%;background:linear-gradient(135deg,var(--gold),#d4a017);display:flex;align-items:center;justify-content:center;font-size:52px;font-weight:900;color:var(--navy-d);box-shadow:0 0 0 6px rgba(240,192,64,.25),0 8px 28px rgba(0,0,0,.3);letter-spacing:-2px}

/* 회원 행 */
.member-row{display:flex;align-items:center;padding:12px 16px;border-bottom:1px solid var(--line);cursor:pointer;gap:13px;background:none;width:100%;text-align:left;border:none;border-bottom:1px solid var(--line)}
.member-row:active{background:var(--paper-d)}
.avatar{width:48px;height:48px;border-radius:50%;background:linear-gradient(135deg,#2a4d8f,#1a3060);color:#fff;display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:700;flex-shrink:0}
.avatar.gold{background:linear-gradient(135deg,var(--gold),#d4a017);color:var(--navy-d)}
.member-name{font-size:17px;font-weight:700;color:var(--ink)}
.member-sub{font-size:13px;color:var(--muted);margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:200px}

/* 인덱스 사이드바 */
#index-rail{position:absolute;right:0;top:0;bottom:0;width:26px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px}
.idx-btn{width:22px;height:20px;border:none;background:none;cursor:pointer;font-size:12px;font-weight:700;color:var(--navy);border-radius:5px;transition:background .1s}
.idx-btn:active{background:var(--gold);color:var(--navy-d)}
.idx-btn.disabled{color:#ccc;cursor:default}

/* 회원카드 */
.card-hero{background:linear-gradient(135deg,#1c3e72,#0e2140);padding:24px 20px 20px;color:#fff;display:flex;align-items:center;gap:16px}
.avatar-lg{width:70px;height:70px;border-radius:50%;background:linear-gradient(135deg,var(--gold),#d4a017);color:var(--navy-d);font-size:24px;font-weight:800;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.card-name{font-size:24px;font-weight:800;letter-spacing:.5px}
.card-rom{font-size:12px;color:rgba(247,230,173,.8);margin-top:4px}
.card-role-badge{display:inline-block;padding:4px 12px;border-radius:20px;background:rgba(240,192,64,.2);border:1px solid rgba(240,192,64,.4);font-size:13px;font-weight:700;color:var(--gold);margin-top:8px}

/* 집행부 */
.exec-chief{background:var(--card);border:2px solid var(--navy);border-radius:16px;margin:0 16px 10px;padding:16px;display:flex;align-items:center;gap:14px}
.exec-row{background:var(--card);border:1px solid var(--line);border-radius:12px;margin:0 16px 8px;padding:12px 14px;display:flex;align-items:center;gap:12px;cursor:pointer}
.two-col{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:0 16px 8px}
.exec-mini{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;cursor:pointer}
.exec-mini-role{font-size:11px;color:var(--muted);margin-bottom:3px}
.exec-mini-name{font-size:15px;font-weight:700;color:var(--ink)}

/* 헌장 */
.tab-row{display:flex;flex-wrap:wrap;border-bottom:2px solid var(--line);background:var(--card);flex-shrink:0}
.reg-tab{width:20%;padding:9px 4px;font-size:11.5px;font-weight:600;color:var(--muted);white-space:nowrap;border:none;border-bottom:2px solid transparent;background:none;cursor:pointer;text-align:center;box-sizing:border-box}
.reg-tab.active{color:var(--navy);border-bottom-color:var(--navy);background:rgba(26,58,107,.05)}
.reg-content{padding:16px 20px;line-height:1.85;font-size:14px;color:var(--ink)}
.reg-h1{font-size:18px;font-weight:800;color:var(--navy);margin:20px 0 8px;font-family:Georgia,serif}
.reg-h2{font-size:15px;font-weight:700;color:var(--navy-d);margin:14px 0 6px}
.search-box{margin:10px 16px;padding:10px 14px;border-radius:12px;border:1.5px solid var(--line);background:var(--card);font-size:15px;width:calc(100% - 32px);outline:none;color:var(--ink)}
.search-box:focus{border-color:var(--navy)}
.highlight{background:#fff3c4;border-radius:2px}

/* 연혁 */
.year-card{background:var(--card);border:1px solid var(--line);border-radius:14px;margin:0 16px 10px;padding:14px 16px;display:flex;justify-content:space-between;align-items:center;cursor:pointer}
.year-card.current{border:2px solid var(--navy)}
.year-badge-current{background:var(--navy);color:#fff;padding:3px 10px;border-radius:20px;font-size:11px;font-weight:700}
.year-badge-past{background:var(--paper-d);color:var(--muted);padding:3px 10px;border-radius:20px;font-size:11px}

/* 토스트 */
#toast{position:fixed;bottom:90px;left:50%;transform:translateX(-50%);background:rgba(14,33,64,.94);color:#fff;padding:12px 22px;border-radius:30px;font-size:14px;font-weight:600;z-index:999;display:none;white-space:nowrap;box-shadow:0 8px 24px rgba(0,0,0,.3)}
</style>

// 관리자 생년월일 목록 (허광탁, 김근우, 박성민)
const ADMIN_BIRTHS = ['19620304', '19730805', '19840226'];

function checkSession() {
  const saved = sessionStorage.getItem('lions_user');
  if (saved) {
    currentUser = JSON.parse(saved);
    isAdmin = ADMIN_BIRTHS.includes(currentUser.birth);
    return true;
  }
  return false;
}

function parseBirth(bStr) {
  // "1962.3.4" → "19620304"
  if (!bStr) return '';
  const parts = bStr.replace(/[^0-9.]/g,'').split('.');
  if (parts.length === 3) {
    const y = parts[0];
    const m = parts[1].padStart(2,'0');
    const d = parts[2].padStart(2,'0');
    return y + m + d;
  }
  return bStr.replace(/\D/g,'').substring(0,8);
}

function doLogin(birth, phone4) {
  const member = MEMBERS_CLEAN.find(m => {
    const b = parseBirth(m.b);
    const p = (m.f||'').replace(/\D/g,'').slice(-4);
    return b === birth && p === phone4;
  });
  if (member) {
    currentUser = {birth, name: member.name, id: member.id};
    isAdmin = ADMIN_BIRTHS.includes(birth);
    sessionStorage.setItem('lions_user', JSON.stringify(currentUser));
    return member;
  }
  return null;
}

const MEMBERS_CLEAN = MEMBERS.filter((m,i,a) => m.name && m.f && a.findIndex(x=>x.name===m.name)===i);

const KA = ['가','나','다','라','마','바','사','아','자','차','카','타','파','하'];

function getInitial(name) {
  if (!name) return '?';
  const c = name.charCodeAt(0);
  if (c < 0xAC00 || c > 0xD7A3) return name[0];
  const idx = Math.floor((c - 0xAC00) / 588);
  return KA[['ㄱ','ㄴ','ㄷ','ㄹ','ㅁ','ㅂ','ㅅ','ㅇ','ㅈ','ㅊ','ㅋ','ㅌ','ㅍ','ㅎ'].indexOf(
    ['ㄱ','ㄲ','ㄴ','ㄷ','ㄸ','ㄹ','ㅁ','ㅂ','ㅃ','ㅅ','ㅆ','ㅇ','ㅈ','ㅉ','ㅊ','ㅋ','ㅌ','ㅍ','ㅎ'][idx]
  )] || name[0];
}

function renderMembers(el) {
  const sorted = [...MEMBERS_CLEAN].sort((a,b) => {

    const ib = KA.indexOf(getInitial(b.name));
    if (ia !== ib) return (ia<0?99:ia)-(ib<0?99:ib);
    return a.name.localeCompare(b.name,'ko');
  });

  el.innerHTML = `
  <div class="appbar">
    <div>
      <div class="appbar-title">회원 명부</div>
      <div class="appbar-sub">정회원 ${MEMBERS_CLEAN.length}명</div>

  </div>`;

  window._membersSorted = sorted;
  renderMemberList(sorted);
  buildIndexRail(sorted);
}

function renderMemberList(list) {
  const container = document.getElementById('member-list');
  if (!container) return;

  // 그룹핑
  const groups = {};
  list.forEach(m => {
    const k = getInitial(m.name);
    (groups[k] = groups[k]||[]).push(m);
  });

  let html = '';
  KA.forEach(k => {
    if (!groups[k]) return;
    html += `<div id="group-${k}" style="scroll-margin-top:8px">
      <div style="position:sticky;top:0;z-index:1;background:var(--paper-d);padding:5px 16px;display:flex;align-items:center;gap:8px;border-bottom:1px solid var(--line)">
        <span style="font-size:15px;font-weight:800;color:var(--navy)">${k}</span>
        <span style="font-size:12px;color:var(--muted)">${groups[k].length}</span>
      </div>`;
    groups[k].forEach(m => {
      html += `<button onclick="showMember(${m.id})" style="width:100%;display:flex;align-items:center;padding:11px 14px;gap:12px;text-align:left;border:none;border-bottom:1px solid var(--line);background:none;cursor:pointer">
        ${avatar(m.name, m.id===1, 46, m.id)}
        <div style="flex:1;min-width:0">
          <div style="display:flex;align-items:center;gap:7px">
            <span style="font-size:17px;font-weight:700;color:var(--ink)">${m.name}</span>
            ${m.group==='집행부'?`<span class="badge badge-exec">${m.role}</span>`:''}
          </div>
          <div style="font-size:13px;color:var(--muted);margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${m.status||'회원'}${m.co?' · '+m.co.split(' · ')[0]:''}</div>
        </div>
        <div style="flex-shrink:0;text-align:right">
          <div style="font-size:11px;color:var(--muted)">${m.j} 입회</div>
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" style="margin-top:3px"><path d="M9 5l7 7-7 7" stroke="#bbb" stroke-width="2.2" stroke-linecap="round"/></svg>
        </div>
      </button>`;
    });
    html += `</div>`;
  });

  if (!html) html = `<div style="text-align:center;color:var(--muted);margin-top:60px;font-size:16px">검색 결과가 없습니다</div>`;
  container.innerHTML = html;
}

function buildIndexRail(list) {
  const rail = document.getElementById('index-rail');
  if (!rail) return;
  const present = new Set(list.map(m => getInitial(m.name)));
  rail.innerHTML = KA.map(k => `
    <button class="idx-btn${!present.has(k)?' disabled':''}" onclick="${present.has(k)?`jumpToGroup('${k}')`:'void 0'}">${k}</button>
  `).join('');
}

function jumpToGroup(k) {
  const el = document.getElementById('group-'+k);
  const list = document.getElementById('member-list');
  if (el && list) list.scrollTo({top: el.offsetTop - 8, behavior:'smooth'});
}

function filterMembers(q) {
  const kw = q.trim().toLowerCase();
  const filtered = kw
    ? window._membersSorted.filter(m => (m.name+m.role+m.co+m.status+(m.rom||'')).toLowerCase().includes(kw))
    : window._membersSorted;
  renderMemberList(filtered);
  if (!kw) buildIndexRail(filtered);
  else document.getElementById('index-rail').innerHTML = '';
}

    2. 제적당시 굿스탠딩 회원이었을 경우<br>
    3. 전입자는 전 소속클럽의 총무로부터 전출확인서를 받아 전입클럽 총무에게 제출하고 이사회의 승인을 받아야 한다.<br>
    4. 전 클럽의 제적일자로부터 전입신청 시까지 1년이 경과하였을 경우는 신입회원 입회절차에 따른다.</p>
    <div class="reg-h2" style="margin-top:18px">제3장 임원</div>
    <p><b>제13조(임원의 구성)</b> 본 클럽의 임원은 회장, 직전회장, 제1부회장, 제2부회장, 제3부회장, 총무, 재무, L.T, T.T, 이사, 감사 및 분과위원장, 장학위원장을 포함하며 필요시 부총무, 부재무를 둘 수 있다.</p>
    <p style="margin-top:10px"><b>제14조(임원의 자격)</b> 굿스탠딩 정회원이 아니면 본 클럽의 임원이 될 자격이 없다.</p>
    <p style="margin-top:10px"><b>제15조(임원의 임무 및 권한)</b><br>
    1. <b>회장</b>: ① 본 클럽을 대표하며 최고 집행자 ② 이사회·월례회·임시회의를 소집하며 주재 ③ 특별·상설위원을 임명하고 각 임원과 협조 ④ 본 클럽 소속 지대 및 지구총재의 자문위원회 위원<br>
    2. <b>직전회장 및 전회장</b>: ① 클럽회합에서 지구임원·내빈을 공식 영접 ② 지역사회에서 새로운 봉사의 뜻을 가진 모든 사람들을 영접함에 있어 본 클럽을 대표<br>
    3. <b>부회장</b>: ① 회장이 임무를 수행하지 못할 경우 서열에 따라 회장 임무 수행 ② 회장의 지휘 하에 회장이 할당한 클럽 위원회를 총괄<br>
    4. <b>총무</b>: 회장과 이사회의 감독·지휘 하에 클럽·지구·협회간 연락임원. ① 지구·협회에서 요구하는 정기 월례보고 및 기타보고 제출 ② 회의록·출석부·위원회 위원임명부·선거·회원주소·전화번호부·회비수납장 등 모든 일반적 기록 관리·보관·유지<br>
    5. <b>재무</b>: ① 각 회원에게 회비 청구·수금하여 이사회 승인 은행에 예금 ② 모든 지출은 이사회 승인 후 집행, 수표·영수증은 재무 서명 외에 이사회 선정 임원 연서 ③ 클럽 수입과 지출 총괄기록 유지·관리 ④ 지구와 이사회에 월별·반기별 재정보고 제출<br>
    6. <b>라이온테마(L.T)</b>: ① 클럽기·배너·종·타봉·회원명찰·라이온 노래책 등 모든 클럽 재산·비품 관리, 집회전 비치·집회 후 정리 ② 집회시 참석자의 적당한 좌석배치, 신입회원이 회원들과 친근해 질 수 있도록 관심<br>
    7. <b>테일 트위스터(T.T)</b>: ① 적절한 여흥과 게임으로 명분있는 벌금 부과, 집회의 조화·우호·생기·열성 촉진 ② 벌금은 주관적으로 결정하지 않으며 적정 금액, 한 집회에서 한 회원에게 두 번 이상 부과 불가 ③ 수금된 금액 즉시 재무에게 인계, 영수증 수령<br>
    8. <b>감사</b>: ① 2명으로 하며 회기 초에 이사회에서 선출 ② 회계·회무일체를 수시 감사하여 회계년도 종료 후 예·결산을 이사회에 감사결과 보고. 특별한 사안 발생시 수시 감사 후 보고 가능<br>
    9. <b>이사</b>: ① 당해연도 회장이 선출하며 이사회의 인준을 거쳐 클럽 회의에서 보고 ② 회장·직전회장·부회장·총무·재무·1년이사·2년이사·선택직이사(전회장·고문·분과위원장·L.T·T.T·부총무·부재무)로 구성<br>
    10. <b>분과위원장</b>:<br>
    &nbsp;&nbsp;① 경조친선: 회원의 경조사시 연락을 담당하며 회원 상호간의 친선 도모에 주력하고 축하 및 조의를 표한 라이온의 명단작성 및 보고<br>
    &nbsp;&nbsp;② 국제친선: 자매클럽과의 친선증진을 위한 상호방문 및 접대에 관한 활동<br>
    &nbsp;&nbsp;③ 사업봉사: 클럽의 제반 봉사사업 활동을 위한 구체적인 대안제시 및 방안 마련<br>
    &nbsp;&nbsp;④ 회원확장: 우수한 회원확장을 위한 적극적인 활동 및 회의시 출석점검 보고와 회원친선에 관한 활동<br>
    &nbsp;&nbsp;⑤ 회무재정: 회무 및 재정상태를 수시점검하며 회비미납 회원과 잦은 연락접촉으로 미수금 및 결손금을 사전 방지하여 회원탈회를 최소화<br>
    &nbsp;&nbsp;⑥ 의전교육: 신입회원의 오리엔테이션을 담당하며, 매월 교육자료를 통한 라이오니즘 교육, 클럽 현장·운영세칙 작성, 클럽행사시 시나리오·기념지 편집<br>
    &nbsp;&nbsp;⑦ 체육레저: 각종 스포츠·체육레저를 통한 회원간의 친선도모와 건강증진을 위한 계획수립, 골프·등산·낚시·환경보존 등<br>
    &nbsp;&nbsp;⑧ 문화홍보: 라이온스 클럽활동에 필요한 지식·정보·문화활동의 개발 및 홍보를 담당<br>
    11. <b>라이오네스회</b>: 네스 회원들의 친목도모와 본 클럽 회원과의 협조로 체험 봉사활동에 주력한다.</p>
    <p style="margin-top:10px"><b>제16조(임원보선)</b><br>
    1. 회장 및 부회장이 결원이 된 경우에는 차순위 부회장이 순위에 따라 승계한다.<br>
    2. 제3부회장이 결원일 경우 잔여임기가 6개월 이상일 때에는 보선하며, 6개월 미만일 때에는 다음 선거 때까지 공석으로 두었다가 그때에 선출한다.<br>
    3. 기타 임원이 결원될 경우 회장이 임명한다. 단, 감사는 이사회의 승인을 받아야 한다.</p>
    <p style="margin-top:10px"><b>제17조(대의원)</b><br>
    1. 협회는 대회참여 클럽에 의하여 관할되므로 본 클럽은 협회 제반 문제에 제의하기 위하여 매년 연차대회에 대의원을 파견하는데 필요한 경비를 지출한다.<br>
    &nbsp;&nbsp;1) 국제대회: 회원 25명당(나머지 과반수 이상 경우) 1명의 대의원과 1명의 대체대의원 파견. 단, 클럽은 최소 1명의 대의원 및 대체대의원 파견 권한 있음.<br>
    &nbsp;&nbsp;2) 지구대회: 회원 10명당(나머지 과반수 이상) 대의원 1명과 대체대의원 1명 파견.<br>
    2. 지구의 문제는 지구연차대회에 상정 채택되므로 본 클럽은 지구에서 할당된 대의원을 파견하며 필요 경비를 지출한다.<br>
    3. 대의원의 수는 협회에 등록된 회원수에 의거 산출된다.</p>
    <div class="reg-h2" style="margin-top:18px">제4장 회의</div>
    <p><b>제18조(월례회)</b> 정기 월례회는 매월 18일 이사회가 정한 장소에서 개최하되 공휴일인 경우 익일로 하며 심의된 내용을 결정 및 보고한다.</p>
    <p style="margin-top:10px"><b>제19조(임시회의)</b><br>
    1. 회장이 필요하다고 인정되거나 이사회 결의가 있을시 회장이 이를 소집한다.<br>
    2. 소집통지서는 임시회의의 목적·시기·장소를 명시하여 7일전에 각 회원에게 우편 혹은 인편으로 발송되어야 한다.</p>
    <p style="margin-top:10px"><b>제20조(이사회)</b><br>
    1. 일시: 매월 3일로 하되, 공휴일인 경우 익일로 한다.<br>
    2. 임시이사회: 회장 혹은 1/3 이상의 이사회 구성원의 요청시 회장은 임시 이사회를 개최할 수 있다.<br>
    3. 임무 및 권한:<br>
    &nbsp;&nbsp;① 클럽이 승인한 시책의 집행을 책임지며, 제반 신규사업 및 시책을 우선 입안·심의한 후 클럽 정기·임시회합에 회부, 회원의 승인을 받는다.<br>
    &nbsp;&nbsp;② 제반지출을 승인하며 클럽의 수입을 초과하는 부채를 조성하지 않는다.<br>
    &nbsp;&nbsp;③ 클럽의 모든 사업에 대하여 임원의 직무상 집행을 수정 또는 취소하는 권한을 가진다.<br>
    &nbsp;&nbsp;④ 연례 또는 필요시 클럽의 재정 및 활동에 대하여 보고를 요청, 감사를 실시케 할 수 있다.<br>
    &nbsp;&nbsp;⑤ 클럽자금을 예금할 은행을 재정위원회의 추천에 의거 지정할 수 있다.<br>
    &nbsp;&nbsp;⑥ 클럽임원의 임무수행을 보증하는 담보설정을 요구할 수 있다.<br>
    &nbsp;&nbsp;⑦ 회기초 감사를 선임하고 회장이 임명한 각 임원의 선임을 인준 결의한다.<br>
    &nbsp;&nbsp;⑧ 신규사업 및 시책에 대한 제 안건을 해당 상설 및 특별위원회에 검토케 하여 이사회에 상정토록 회부한다.<br>
    &nbsp;&nbsp;⑨ 클럽회원의 승인을 받아 지구 및 국제대회에 파견되는 본 클럽의 대의원 및 교체 대의원을 지명하여 임명한다.<br>
    &nbsp;&nbsp;⑩ 회계계정관례상 클럽자산 및 재정을 두 개 이상의 기금으로 분리해서 유지·관리할 수 있다.</p>
    <p style="margin-top:10px"><b>제21조(전형위원회)</b><br>
    1. 구성: 본 클럽 회장직을 역임한 전회장, 직전회장, 당해연도 회장, 이사회에서 선임된 고문으로 한다.<br>
    2. 기능: 차기회장·1·2·3부회장의 인준 및 선임. 매년 3월 차기회장단 선임을 위해 실시하며, 회장단 보선 필요시는 수시로 회장이 소집한다.</p>
    <p style="margin-top:10px"><b>제22조(장학위원회)</b><br>
    1. 구성: 전회장 전원과 이사회에서 선임된 고문으로 한다.<br>
    2. 기능: 장학기금 관리운영 및 당해연도 장학생 선발·지급에 관한 활동</p>
    <p style="margin-top:10px"><b>제23조(주년행사)</b><br>
    1. 주년행사는 이사회가 정한 일시와 장소에서 개최한다.<br>
    2. 본 기념식에서는 라이오니즘의 목적·윤리강령 및 본 클럽의 연혁에 특별한 관심을 기울이도록 한다.<br>
    3. 본 기념식에서는 신구회장 및 임원의 이·취임식을 겸한다.</p>
    <p style="margin-top:10px"><b>제24조(의결)</b> 본 클럽 헌장에 특별히 정한 경우를 제외하고는, 모든 회의의 의결은 재적인원 과반수 참석에 참석인원 과반수 동의로 한다.</p>
    <p style="margin-top:10px"><b>제25조(의사진행)</b> 본 헌장 및 부칙에 별도로 규정된 것 외에 클럽의 회합과 활동, 이사회 및 위원회의 의사진행 절차는 수시로 개정되는 최신판 로버트 의사진행 규칙에 따른다.</p>
    <p style="margin-top:10px"><b>제26조(헌장개정)</b> 이사회 구성원의 과반수 참석과 참석이사 2/3 이상의 찬성을 얻어, 본 클럽 정족수로 구성된 정기 월례회 혹은 임시회의에서 출석회원 2/3 이상의 찬성투표로 개정할 수 있다.</p>
    <p style="margin-top:10px"><b>제27조(개정안 통보의무)</b> 개정안이 투표로 가부를 결정하는 회합 2주전에 개정안을 명시한 공고가 우편 혹은 인편으로 발송되지 아니하고는 개정안에 대한 투표를 실시할 수 없다.</p>
    <div class="reg-h2" style="margin-top:18px">제5장 재정</div>
    <p><b>제28조(회계년도)</b> 본 클럽의 회계연도는 7월 1일부터 익년 6월 30일까지로 한다.</p>
    <p style="margin-top:10px"><b>제29조(재정)</b> 본 클럽의 재정은 입회비, 월회비, 봉사금, 특별협찬금, 기타 수입금으로 한다.</p>
    <p style="margin-top:10px"><b>제30조(회비)</b><br>
    1. 입회비·월례회비·이사회비·의무봉사금 등은 당해연도 이사회 결의에 따른다.<br>
    2. 재입회·전입 회원의 입회비는 전액 또는 일부를 면제할 수도 있다.<br>
    3. 평생회원은 클럽 이사회에서 정한 소정의 연회비를 납부해야 한다.<br>
    4. 원로회원은 연회비 및 의무봉사금을 면제한다.<br>
    5. 이사회에 소속된 라이온은 이사회비를 납부해야 한다. 단, 원로회원은 면제(평생회원은 이사로 재임할 경우 이사회비 납부).<br>
    6. 모든 회비 및 의무봉사금은 매 회기년도 초(매년 10월말 이전)까지 납부해야 한다.<br>
    7. 재무로부터 미납금 통지를 받고도 소정의 기한 내에 납부하지 않은 회원은 굿스탠딩 자격을 상실하며 완납 후에 자격을 회복한다.</p>
    <div class="reg-h2" style="margin-top:18px">제6장 각막기증봉사사업</div>
    <p><b>제31조(명칭)</b> 부산라이온스클럽 본회가 주제하는 봉사사업으로 각막기증봉사사업이라 한다.</p>
    <p style="margin-top:10px"><b>제32조(목적)</b> 미국LA코리아타운라이온스클럽과 부산라이온스클럽의 협력으로 시력보존을 위한 각막기증사업을 할 수 있다.</p>
    <p style="margin-top:10px"><b>제33조(재정)</b><br>
    1. 각막기증사업은 부산라이온스클럽 60주년 행사시 출연금 일천만원을 기본기금으로 한다.<br>

    <p style="margin-top:10px"><b>제34조(수혜자선정)</b> 각막기증 수혜자 선정 및 이식수술에 관한 절차는 부산라이온스클럽 60주년 당시 부산 백병원과의 협약 원칙에 따른다. 단, 부산라이온스클럽의 모든 진행은 당해연도 본회 회장이 진행한다.</p>
    <div class="reg-h2" style="margin-top:18px">부칙</div>
    <p><b>제1조</b> 본 클럽은 회원 및 어느 특정인의 공직활동을 위한 여하한 서명이나 정치적 후보를 추천하지 아니하며 회합에서는 회원들이 정당이나 종파에 관한 토론을 하지 않는다.</p>
    <p style="margin-top:10px"><b>제2조</b> 본 클럽의 임원과 회원은 라이오니즘을 성장시키는 경우를 제외하고는 개인적·정치적 야심을 달성하는 수단으로 회원을 이용하지 못하며, 클럽목적에 위배되는 활동에 참여하지 않는다.</p>
    <p style="margin-top:10px"><b>제3조</b> 회합중 회원이 아닌 어느 특정 단체나 개인에게 기부금이 모금될 수 없으며, 정규 의무금 이외에 수입 및 지출을 필요로 하는 제의 및 발의는 이사회에 회부한다.</p>
    <p style="margin-top:10px"><b>제4조</b> 본 클럽 규정에 의한다. 회장이 필요하다고 판단될 시 회장은 특별위원회를 설치할 수 있다.</p>
    <p style="margin-top:10px"><b>제5조(휘장, 뺏지)</b> 본 클럽의 휘장 및 뺏지의 색깔은 협회에서 사용하는 것과 동일한 것으로 하며, 전 회원은 공식행사시 필히 뺏지를 부착하여야 한다.</p>
    <p style="margin-top:10px"><b>제6조</b> 본 클럽이 신생클럽을 스폰서 할 경우 라이온스 기·타종·사무용 책걸상·배너·테이블보 1점씩을 기증함을 원칙으로 하되, 이사회 결의에 따른다.</p>
    <p style="margin-top:10px"><b>제7조</b> 본 클럽 사무직원은 신회계년도 이사회의 신임에 의한다.</p>
    <p style="margin-top:10px"><b>제8조(이사회 구성)</b> 클럽 이사회 구성은 직전회장·제1·2·3부회장·총무·재무·라이온테마·테일튀스터는 당연직 이사이며, 당해연도 회장이 추천하여 이사회에 선출된 1년직·2년직 이사를 5월에 결정하여 6월에 취임, 7월 1일 회장단과 업무를 개시한다. 회장은 모든 위원회의 표결권 없는 위원이 될 수 있다. 클럽의 운영 또는 사업에 관한 제반문제는 각 해당 위원회에서 검토한 후 이사회에 상정시킨다.</p>
    <p style="margin-top:10px"><b>제9조</b> 제명된 탈회 회원은 본 클럽이 소유하고 있는 고정 및 유동자산에 대한 권한이 소멸되며 자산에 분배권을 요구하지 못한다.</p>
    <p style="margin-top:10px"><b>제10조</b> 평생회원은 국제기구에 의무금 면제, 클럽 및 기타 단체의무금은 납부해야 하며 클럽 연회비를 납부해야만 정회원의 의무를 다할 수 있다. 단, 클럽에서 이사회에 의한 결정에 따라 회비를 정할 수 있다. 회비 또는 기타 단체·지구·클럽에 연회비를 납부하지 않을 경우에는 회원의 의무를 다할 수 없다.</p>

    <p style="margin-top:10px"><b>제2조(문서의 용어)</b> 문서는 한글로 쓰되 표준어를 사용한다. 숫자는 아라비아 숫자로 표시하며 년·월·일의 끝자는 생략하고 점(.)으로 구분한다.</p>
    <p style="margin-top:10px"><b>제3조(수정)</b> 문서 원안의 일부분을 삭제·수정할 때는 삭제자 또는 수정자가 날인. 회계장부는 붉은선으로 수정.</p>

    <p style="margin-top:10px"><b>제11조(발신명의)</b> 문서는 회장 명의로 발신. 총무전행에 속하는 문서와 클럽운영 관련보고·안내·공고·협조 등에 관한 문서는 총무 및 재무 명의로 발신 가능.</p>

    <p style="margin-top:10px"><b>제18조(문서의 보관)</b> 완결된 문서는 서류함(파일박스·캐비넷)에 보관. 미결문서는 완결될 때까지 지정 서류함에 보관. 권리증서·신원보증서·재정보증서 등 주요문건은 총무가 관리.</p>
    <p style="margin-top:10px"><b>제19조(보존기간)</b> 영구보존, 10년 보존, 5년 보존, 1년 보존으로 구분하며 보존기간별 문서의 종별은 월별 또는 기별로 할 수 있다. 보존기간이 완료된 문서일지라도 계속 보관할 필요가 있다고 판단할 때에는 상당기간을 정하여 보관할 수 있다.</p>
    <p style="margin-top:10px"><b>제20조(보존기간의 기산)</b> 보존기간은 처리 완결된 사업년도의 다음 사업년도 개시일로부터 기산한다.</p>
    <p style="margin-top:10px"><b>제21조(보존의 방법)</b><br>

let currentRegTab = '윤리강령';

function renderRules(el) {
  const tabs = ['윤리강령','L.I.O.N.S','라이온스 찬가','클럽 노래','헌장·부칙','문서규정','경조규정','장학규정','지도자수칙','공적심사'];
  el.innerHTML = `
  <div class="appbar">
    <div>
      <div class="appbar-title">헌장 · 규정</div>
      <div class="appbar-sub">부산라이온스클럽</div>
    </div>
  </div>
  <input id="reg-search" class="search-box" placeholder="규정 내 검색..." oninput="searchReg(this.value)" autocomplete="off" style="margin-top:10px"/>
  <div class="tab-row" id="reg-tabrow">
    ${tabs.map(t=>`<button class="reg-tab${t===currentRegTab?' active':''}" onclick="switchRegTab('${t}')" id="rtab-${t.replace(/[^a-zA-Z가-힣]/g,'_')}">${t}</button>`).join('')}
  </div>
  <div id="reg-body" class="scroll">${REGS[currentRegTab]}</div>`;
}

function switchRegTab(t) {
  currentRegTab = t;
  document.querySelectorAll('.reg-tab').forEach(b => b.classList.remove('active'));
  const safe = t.replace(/[^a-zA-Z가-힣]/g,'_');
  const btn = document.getElementById('rtab-'+safe);
  if (btn) btn.classList.add('active');
  document.getElementById('reg-body').innerHTML = REGS[t];
  document.getElementById('reg-search').value = '';
}

function searchReg(q) {
  const kw = q.trim();
  const body = document.getElementById('reg-body');
  if (!kw) { body.innerHTML = REGS[currentRegTab]; return; }
  let html = REGS[currentRegTab];
  const re = new RegExp(kw.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'),'gi');
  body.innerHTML = html.replace(re, m => `<mark class="highlight">${m}</mark>`);
}

function showAdminEditMember(id) {

  div.className = 'screen';
  div.style.cssText = 'position:absolute;inset:0;z-index:22;display:flex;flex-direction:column';
  screens.appendChild(div);
  div.innerHTML = `
  <div class="appbar">
    <button class="appbar-back" onclick="this.closest('.screen').remove()">

    </button>

  </div>
  <div class="scroll" style="padding:16px;padding-bottom:30px">
    ${['name:이름', 'role:LC직책', 'co:직업/회사', 'coAddr:근무처 주소', 'f:휴대폰', 'b:생년월일', 'spouse:배우자'].map(field => {

function uploadMemberPhoto(id, input) {
  const file = input.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = (e) => {
    // 로컬 미리보기 (Firebase 연동 전)
    const imgs = document.querySelectorAll('[data-member-id="' + id + '"] img');
    showToast(file.name + ' 선택됨 (Firebase 연동 후 저장)');
  };
  reader.readAsDataURL(file);
}
